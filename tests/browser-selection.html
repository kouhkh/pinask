<!doctype html><meta charset="utf-8"><title>PinAsk selection regression fixture</title>
<link rel="stylesheet" href="/overlay/pinask.css">
<style>body{margin:0;height:2000px}#controls{position:fixed;top:4px;left:4px;z-index:2147483647;background:white}#status{max-width:750px}#window-target{position:absolute;top:350px;left:80px}#nested{position:absolute;top:450px;left:80px;width:250px;height:150px;overflow:auto;border:1px solid}#nested-inner{height:600px;padding-top:180px}#arena{position:absolute;left:400px;top:50px;width:400px;height:400px}#arena>*{position:absolute;box-sizing:border-box;background:#ddeeff;margin:0}#outer{left:30px;top:30px;width:250px;height:300px;background:transparent}#inside{left:100px;top:100px;width:40px;height:30px}#left{left:30px;top:130px;width:40px;height:30px}#right{left:230px;top:130px;width:40px;height:30px}#top{left:100px;top:30px;width:40px;height:40px}#bottom{left:100px;top:230px;width:40px;height:40px}#outside{left:300px;top:130px;width:40px;height:30px}#ignored{left:130px;top:130px;width:50px;height:30px}#mass{position:absolute;left:450px;top:100px;width:200px;height:200px;display:none}.mass{position:absolute;width:10px;height:10px}</style>
<div id="controls" data-pinask-ignore><button id="run">运行独立回归</button><pre id="status">ready</pre></div>
<button id="window-target">window target</button><div id="nested"><div id="nested-inner"><button id="nested-target">nested target</button></div></div>
<div id="arena"><div id="outer" aria-label="outer"></div><div id="inside" aria-label="inside"></div><span id="left" aria-label="left"></span><p id="right" aria-label="right"></p><div id="top" aria-label="top"></div><span id="bottom" aria-label="bottom"></span><div id="outside" aria-label="outside"></div><div id="ignored" data-pinask-ignore><button>ignored child</button></div></div><div id="mass"></div>
<script>const script=document.createElement('script');script.src=new URLSearchParams(location.search).get('baseline')?'/baseline-pinask.js':'/overlay/pinask.js';document.head.append(script);</script>
<script>
const $=id=>document.getElementById(id);const wait=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));let captured;
function frame(x1,y1,x2,y2){const m=$('pinask-mask');m.dispatchEvent(new PointerEvent('pointerdown',{clientX:x1,clientY:y1,pointerId:1,button:0,bubbles:true}));m.dispatchEvent(new PointerEvent('pointermove',{clientX:x2,clientY:y2,pointerId:1,button:0,bubbles:true}));m.dispatchEvent(new PointerEvent('pointerup',{clientX:x2,clientY:y2,pointerId:1,button:0,bubbles:true}));}
async function snapshot(){captured=null;$('pinask-question').value='local synthetic fixture';$('pinask-save').click();await wait();return captured?.ui_elements||[];}
function reset(){PinAsk.setOn(false);PinAsk.setOn(true);document.querySelector('[data-group-id="red"]').click();}
function frameOne(id){const r=$(id).getBoundingClientRect();frame(r.left-1,r.top-1,r.right+1,r.bottom+1);}
function errorFor(id){const r=$(id).getBoundingClientRect();const marks=[...document.querySelectorAll('.pinask-mark')];return Math.min(...marks.map(m=>Math.abs(parseFloat(m.style.top)-Math.round(r.top))+Math.abs(parseFloat(m.style.left)-Math.round(r.left))));}
$('run').onclick=async()=>{const checks=[];try{PinAsk.mount({onSave:async batch=>{captured=JSON.parse(JSON.stringify(batch));return {id:'fixture-only'};}});PinAsk.setOn(true); // Synthetic pointer fixture has no browser pointer capture; listeners otherwise execute unchanged.
$('pinask-mask').setPointerCapture=()=>{};
reset();frameOne('window-target');scrollTo(0,120);await wait();checks.push({name:'window-scroll',pass:errorFor('window-target')===0,positionError:errorFor('window-target')});scrollTo(0,0);await wait();$('window-target').style.left='110px';window.dispatchEvent(new Event('resize'));await wait();checks.push({name:'resize-layout',pass:errorFor('window-target')===0,positionError:errorFor('window-target')});
$('nested').scrollTop=130;await wait();reset();frameOne('nested-target');$('nested').scrollTop=180;await wait();checks.push({name:'nested-scroll',pass:errorFor('nested-target')===0,positionError:errorFor('nested-target')});const nestedRows=await snapshot();checks.push({name:'saved-rect-after-scroll',pass:nestedRows.find(x=>x.id==='nested-target')?.rect.y===Math.round($('nested-target').getBoundingClientRect().top)});
reset();frame(450,100,650,300);const redChips=[...document.querySelectorAll('.pinask-chip')].map(e=>e.getAttribute('aria-label'));document.querySelector('[data-group-id="blue"]').click();frame(450,100,650,300);const rows=await snapshot();const ids=rows.map(r=>r.id);for(const id of ['inside','left','right','top','bottom'])checks.push({name:'frame-'+id,pass:ids.includes(id)});for(const id of ['outer','outside','ignored'])checks.push({name:'excluded-'+id,pass:!ids.includes(id)});checks.push({name:'multi-group',pass:['inside','left','right','top','bottom'].every(id=>rows.find(r=>r.id===id)?.groups.length===2)});reset();frame(450,100,650,300);document.querySelector('[data-group-id="blue"]').click();frame(450,100,650,300);document.querySelector('[data-group-id="red"]').click();frame(450,100,650,300);const remaining=await snapshot();checks.push({name:'toggle-red-preserves-blue',pass:['inside','left','right','top','bottom'].every(id=>remaining.find(r=>r.id===id)?.groups.length===1&&remaining.find(r=>r.id===id)?.groups[0].id==='blue')});
$('arena').style.display='none';$('mass').style.display='block';for(let i=0;i<95;i++){const n=document.createElement('button');n.className='mass';n.id='mass-'+i;n.setAttribute('aria-label',n.id);n.style.left=(i%10)*18+'px';n.style.top=Math.floor(i/10)*18+'px';$('mass').append(n);}reset();frame(445,95,655,305);const many=await snapshot();checks.push({name:'over-80-no-silent-loss',pass:many.filter(x=>x.id.startsWith('mass-')).length===95,count:many.filter(x=>x.id.startsWith('mass-')).length});PinAsk.setOn(false);$('status').textContent=JSON.stringify({status:checks.every(c=>c.pass)?'PASS':'FAIL',checks},null,2);}catch(e){$('status').textContent=JSON.stringify({status:'ERROR',message:e.message,checks});}};
</script>
